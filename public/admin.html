<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Fashion Hub — Admin</title><link rel="stylesheet" href="/ban-style.css"></head><body><main class="admin-wrap"><header class="admin-head"><div><div class="brand">👗 My Fashion Hub</div><p class="muted">Store Admin</p></div><a class="admin-link" href="/">View store</a></header><section id="loginCard" class="admin-card"><h1>Admin login</h1><form id="loginForm" class="form"><input id="username" placeholder="Username" required><input id="password" type="password" placeholder="Password" required><button class="primary">Login</button><p id="loginMsg" class="msg"></p></form></section><section id="panel" class="hidden"><div class="admin-stats"><div class="stat-card"><b id="newCount">0</b><span>New orders</span></div><div class="stat-card"><b id="processingCount">0</b><span>Processing</span></div><div class="stat-card"><b id="completedCount">0</b><span>Completed</span></div><div class="stat-card"><b id="revenueTotal">KSh 0</b><span>Order value</span></div></div><div class="admin-grid"><section class="admin-card"><h2>➕ Post a product</h2><form id="productForm" class="form"><input id="name" placeholder="Product name" required><input id="price" type="number" min="0" step="1" placeholder="Price in KSh" required><select id="category"><option value="clothing">Clothing</option><option value="shoes">Shoes</option><option value="accessories">Accessories</option><option value="home">Home</option><option value="other">Other</option></select><input id="icon" placeholder="Emoji, e.g. 👕" value="🛍️"><label class="muted">Product photo</label><input id="photo" type="file" accept="image/*"><small class="muted">Choose a photo from your phone or computer. It will be resized automatically.</small><input id="image" type="url" placeholder="Or paste product image URL (optional)"><textarea id="description" rows="4" placeholder="Product description" required></textarea><input id="stock" type="number" min="0" step="1" placeholder="Stock quantity" value="1"><button class="primary">Publish product</button><p id="productMsg" class="msg"></p></form></section><section class="admin-card"><div class="admin-list-head"><h2>📦 Products</h2><button id="logout">Log out</button></div><div id="productList"></div></section></div><section class="admin-card orders-card"><div class="admin-list-head"><div><h2>🧾 Orders</h2><p class="muted">Manage My Fashion Hub customer orders and update their status.</p></div><button id="refreshOrders">Refresh</button></div><div id="orderList"></div></section></section></main><script src="/admin.js"></script></body></html>
